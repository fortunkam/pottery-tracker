# .github/workflows/pottery-project-automation.yml

name: Move pottery items ready to trim

on:
  workflow_dispatch:
  schedule:
    # Runs every morning UK time
    - cron: "15 7 * * *"

jobs:
  move-ready-to-trim:
    runs-on: ubuntu-latest

    steps:
      - name: Move thrown items to ready to trim after 2 days
        uses: actions/github-script@v7
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        with:
          script: |
            const { getOctokit } = require("@actions/github");

            const OWNER = "fortunkam";              // change if needed
            const OWNER_TYPE = "user";              // "user" or "org"
            const PROJECT_NUMBER = 1;               // change to your project number

            const STATUS_FIELD_NAME = "Status";
            const THROWN_DATE_FIELD_NAME = "Thrown Date";

            const FROM_STATUS = "Thrown";
            const TO_STATUS = "Ready to trim";
            const AGE_DAYS = 2;

            const projectToken = process.env.PROJECT_TOKEN;

            if (!projectToken) {
              throw new Error(
                "Missing PROJECT_TOKEN secret. Set it to a classic personal access token with the 'project' scope. Fine-grained personal access tokens cannot access Projects owned by a user account."
              );
            }

            const projectGithub = getOctokit(projectToken);

            async function graphql(query, variables) {
              try {
                return await projectGithub.graphql(query, variables);
              } catch (error) {
                const hasProjectAccessError = Array.isArray(error?.errors) && error.errors.some(
                  entry => entry?.type === "FORBIDDEN" && entry?.message === "Resource not accessible by personal access token"
                );

                if (hasProjectAccessError) {
                  throw new Error(
                    "PROJECT_TOKEN must be a classic personal access token with the 'project' scope (or 'repo', which also grants project access). Fine-grained personal access tokens cannot access Projects owned by a user account."
                  );
                }

                throw error;
              }
            }

            const projectQuery = `
              query($login: String!, $number: Int!) {
                ${OWNER_TYPE === "org" ? "organization" : "user"}(login: $login) {
                  projectV2(number: $number) {
                    id

                    fields(first: 100) {
                      nodes {
                        ... on ProjectV2Field {
                          id
                          name
                          dataType
                        }
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }

                    items(first: 100) {
                      nodes {
                        id

                        content {
                          ... on Issue {
                            id
                            number
                            title
                            closed
                            url
                          }
                        }

                        fieldValues(first: 100) {
                          nodes {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              name
                              optionId
                              field {
                                ... on ProjectV2SingleSelectField {
                                  id
                                  name
                                }
                              }
                            }

                            ... on ProjectV2ItemFieldDateValue {
                              date
                              field {
                                ... on ProjectV2Field {
                                  id
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const result = await graphql(projectQuery, {
              login: OWNER,
              number: PROJECT_NUMBER
            });

            const ownerNode = OWNER_TYPE === "org" ? result.organization : result.user;
            const project = ownerNode.projectV2;

            if (!project) {
              throw new Error(`Could not find project number ${PROJECT_NUMBER}`);
            }

            const statusField = project.fields.nodes.find(
              f => f && f.name === STATUS_FIELD_NAME
            );

            if (!statusField) {
              throw new Error(`Could not find field named '${STATUS_FIELD_NAME}'`);
            }

            const thrownDateField = project.fields.nodes.find(
              f => f && f.name === THROWN_DATE_FIELD_NAME
            );

            if (!thrownDateField) {
              throw new Error(`Could not find field named '${THROWN_DATE_FIELD_NAME}'`);
            }

            const targetStatusOption = statusField.options.find(
              o => o.name === TO_STATUS
            );

            if (!targetStatusOption) {
              throw new Error(`Could not find status option '${TO_STATUS}'`);
            }

            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - AGE_DAYS);

            // Compare dates only, not time-of-day.
            const cutoffDateOnly = cutoff.toISOString().substring(0, 10);

            const updateStatusMutation = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: {
                      singleSelectOptionId: $optionId
                    }
                  }
                ) {
                  projectV2Item {
                    id
                  }
                }
              }
            `;

            for (const item of project.items.nodes) {
              const issue = item.content;

              if (!issue || issue.closed) {
                continue;
              }

              const statusValue = item.fieldValues.nodes.find(
                v => v?.field?.id === statusField.id
              );

              const thrownDateValue = item.fieldValues.nodes.find(
                v => v?.field?.id === thrownDateField.id
              );

              const currentStatus = statusValue?.name;
              const thrownDate = thrownDateValue?.date;

              if (!thrownDate) {
                console.log(`Skipping #${issue.number} because '${THROWN_DATE_FIELD_NAME}' is not set`);
                continue;
              }

              const isThrown = currentStatus === FROM_STATUS;
              const isOldEnough = thrownDate <= cutoffDateOnly;

              if (isThrown && isOldEnough) {
                console.log(
                  `Moving #${issue.number} '${issue.title}' from '${FROM_STATUS}' to '${TO_STATUS}'. Thrown Date: ${thrownDate}`
                );

                await graphql(updateStatusMutation, {
                  projectId: project.id,
                  itemId: item.id,
                  fieldId: statusField.id,
                  optionId: targetStatusOption.id
                });
              }
            }